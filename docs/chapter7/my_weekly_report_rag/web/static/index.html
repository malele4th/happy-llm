<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>周报助手</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">周</div>
        <div>
          <h1>周报助手</h1>
          <p id="status-text">连接中…</p>
        </div>
      </div>

      <section class="panel hints">
        <h2>示例问题</h2>
        <button class="hint" type="button">2025年12月 catchii 有什么进展？</button>
        <button class="hint" type="button">rank 模型最近做了什么优化？</button>
        <button class="hint" type="button">家族房项目的时间线</button>
      </section>
    </aside>

    <main class="chat">
      <div id="messages" class="messages">
        <div class="message assistant welcome">
          <div class="bubble">你好，我是周报检索助手。你可以询问项目进展、某月工作内容等，我会从周报中检索并给出带引用的回答。</div>
        </div>
      </div>

      <form id="chat-form" class="composer">
        <textarea
          id="input"
          rows="2"
          placeholder="输入问题，Enter 发送，Shift+Enter 换行"
          required
        ></textarea>
        <button id="send-btn" type="submit">发送</button>
      </form>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
